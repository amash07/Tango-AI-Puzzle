<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tango AI Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tango AI Puzzle</h1>
            <p class="subtitle">Solve the puzzle yourself or watch AI solve it.</p>
            <button id="theme-toggle" class="theme-toggle" title="Toggle Dark Mode">🌙</button>
        </header>

        <div class="game-area">
            <div class="main-panel">
                <div class="settings-bar">
                    <label for="grid-size">Grid Size:</label>
                    <select id="grid-size">
                        <option value="4">4 x 4</option>
                        <option value="6" selected>6 x 6</option>
                    </select>
                    
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="status-panel" id="status-panel">
                    <span id="status-message">Ready to play</span>
                </div>

                <div class="puzzle-grid" id="puzzle-grid">
                    <!-- Grid cells will be generated by JS -->
                </div>

                <div class="controls">
                    <button id="btn-check" class="primary-btn">Check Solution</button>
                    <button id="btn-solve" class="secondary-btn">Solve with AI</button>
                    <button id="btn-step" class="secondary-btn">Step-by-step AI</button>
                    <button id="btn-generate" class="action-btn">Generate New Puzzle</button>
                    <button id="btn-reset" class="action-btn">Reset Board</button>
                </div>
            </div>

            <div class="side-panel">
                <div class="log-panel">
                    <h3>AI Solver Log</h3>
                    <div id="ai-log" class="log-content">
                        <p class="log-entry system">Awaiting AI solver...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Puzzle Solved!</h2>
            <p class="modal-desc" id="modal-desc">You completed the puzzle successfully.</p>
            <button id="btn-modal-close" class="primary-btn">Awesome!</button>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="solver.js"></script>
    <script src="puzzleGenerator.js"></script>
    <script src="script.js"></script>
</body>
</html>
